<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>FonemaViva • Palavras Divertidas</title>

  <link rel="preconnect"
  href="https://fonts.googleapis.com">

  <link rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet">

  <link rel="stylesheet"
  href="./css/palavras.css">

</head>

<body>

  <header class="topbar">

    <h1>FonemaViva</h1>

    <span>
      Exercício • Palavras Divertidas
    </span>

  </header>

  <main class="container">

    <section class="progresso-container">

      <div class="progresso-top">

        <p>Seu progresso</p>

        <span id="progresso-texto">
          0%
        </span>

      </div>

      <div class="progresso-barra">

        <div id="progresso"></div>

      </div>

    </section>

    <section class="card">

      <p class="mini-texto">
        Palavra atual
      </p>

      <h2 id="palavra">
        Banana
      </h2>

      <p class="instrucao">
        Clique no botão e fale a palavra divertida.
      </p>

      <button id="gravar"
      class="btn-mic">

        🎤 Falar Palavra

      </button>

      <div class="resultado-box">

        <p>
          Você falou:
        </p>

        <span id="resultado">
          ...
        </span>

      </div>

      <p id="feedback"></p>

    </section>

    <div class="nav-botoes">

      <button id="proximo"
      class="btn-nav">

        Próxima →

      </button>

    </div>

  </main>

  <script src="./js/palavras.js"></script>

</body>
</html>
