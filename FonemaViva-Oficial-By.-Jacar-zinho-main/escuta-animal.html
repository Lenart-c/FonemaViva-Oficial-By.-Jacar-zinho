<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FonemaViva • Escuta ativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="./Img/goatfc.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/escuta-animal.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <h1><i class="fa-solid fa-wave-square"></i> FonemaViva</h1>
    </div>

    <button class="back-btn" onclick="history.back()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">Exercício fonológico</p>
      <h2>Escuta ativa</h2>
      <p class="intro">
        Ouça o som do animal e diga o nome dele em voz alta.
      </p>
    </section>

    <section class="card">
      <div class="painel-visual">
        <div class="icone-animal" id="iconeAnimal">🐶</div>
        <button id="btn-ouvir" class="btn btn-primary">Ouvir som</button>
      </div>

      <div class="painel-instrucao">
        <div class="fase-box">
          <p class="label">Desafio</p>
          <h3 id="fase">Aperte ouvir</h3>
          <p id="instrucao">Escute com atenção e responda com o nome do animal.</p>
        </div>

        <div class="progress-box">
          <div class="barra">
            <div id="progresso" class="barra-fill"></div>
          </div>
          <span id="tempo">0/3</span>
        </div>

        <div class="acoes">
          <button id="btn-escutar" class="btn btn-primary">Ouvir novamente</button>
          <button id="btn-falar" class="btn btn-secondary">Falar resposta</button>
          <button id="btn-reiniciar" class="btn btn-secondary">Reiniciar</button>
        </div>

        <div class="resposta-box">
          <label for="resposta">Sua resposta</label>
          <input id="resposta" type="text" placeholder="Digite ou fale o nome do animal" />
          <button id="btn-validar" class="btn btn-secondary">Validar</button>
        </div>

        <p id="feedback" class="feedback">Vamos começar!</p>
      </div>
    </section>
  </main>

  <script src="./js/escuta-animal.js"></script>
</body>
</html>
