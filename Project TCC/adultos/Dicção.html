<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> FonemaViva • Disafio de Dicção </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="shortcut icon" href="../Img/goatfc.png">
  <link rel="stylesheet" href="../css/Dicção.css">

</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

    <div class="logo">
    <h1><i class="fa-solid fa-wave-square"></i> FonemaViva</h1>
  </div>

    <span class="sub">
      Exercícios • Disafio de Dicção
    </span>

  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- PROGRESSO -->
    <section class="progresso-container">

      <div class="progresso-top">

        <p>Seu progresso</p>

        <span id="progresso-texto">
          0%
        </span>

      </div>

      <div class="progresso-barra">

        <div id="progresso"></div>

      </div>

    </section>

    <!-- CARD -->
    <section class="card">

      <p class="instrucao">
        Leia a frase em voz alta:
      </p>

      <h2 id="frase">
        ...
      </h2>

      <!-- BOTÃO MICROFONE -->
      <button id="gravar"
      class="btn-mic">

        🎤 Falar Frase

      </button>

      <!-- RESULTADO -->
      <div class="resposta">

        <span>
          Você falou:
        </span>

        <strong id="resultado">
          ...
        </strong>

      </div>

      <!-- FEEDBACK -->
      <p id="feedback"></p>

    </section>

    <!-- NAVEGAÇÃO -->
    <div class="nav-botoes">

      <button id="proximo"
      class="btn-next">

        Próxima →

      </button>

    </div>

  </main>

  <!-- JS -->
  <script src="../js/Dicção.js"></script>

</body>

</html>
