<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> FonemaViva • Exercícios </title>
  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="../Img/goatfc.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/sons-rl.css">

</head>

<body>

  <!-- HEADER -->
  <header class="topbar">

  <div class="logo">
    <h1><i class="fa-solid fa-wave-square"></i> FonemaViva</h1>
  </div>

  <div class="header-right">
    
    <button id="btnVoltar" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <span>
      Exercícios • R e L
    </span>


  </div>

</header>

  <!-- MAIN -->
  <main class="container">

    <!-- PROGRESSO -->
    <section class="progresso-container">

      <div class="progresso-top">

        <p>Seu progresso</p>

        <span id="progresso-texto">
          0%
        </span>

      </div>

      <div class="progresso-barra">

        <div id="progresso"></div>

      </div>

    </section>

    <!-- CARD -->
    <section class="card">

      <p class="mini-texto">
        Palavra atual
      </p>

      <h2 id="palavra">
        Rato
      </h2>

      <p class="instrucao">
        Clique no botão abaixo e fale a palavra.
      </p>

      <!-- BOTÃO -->
      <button id="gravar"
      class="btn-mic">

        🎤 Falar Palavra

      </button>

      <!-- RESULTADO -->
      <div class="resultado-box">

        <p>
          Você falou:
        </p>

        <span id="resultado">
          ...
        </span>

      </div>

      <!-- FEEDBACK -->
      <p id="feedback"></p>

    </section>

    <!-- NAVEGAÇÃO -->
    <div class="nav-botoes">

      <button id="proximo"
      class="btn-nav">

        Próxima →

      </button>

    </div>

  </main>

  <!-- JS -->
  <script src="../js/sons-rl.js"></script>

</body>
</html>
