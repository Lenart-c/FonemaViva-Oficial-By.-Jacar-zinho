<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FonemaViva • Língua Maluca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/lingua-maluca.css">
  <link rel="shortcut icon" href="../Img/goatfc.png">
</head>

<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Exercício fonológico</p>
      <h1>Língua maluca</h1>
      <p class="subtitle">Trabalhe articulação e fluidez com sequências curtas e repetição.</p>
    </div>
    <a class="voltar" href="../crianças/criancas.html">← Voltar</a>
  </header>

  <main class="container">
    <section class="progress-card">
      <div class="progress-top">
        <span>Seu progresso</span>
        <span id="progresso-texto">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progresso"></div>
      </div>
    </section>

    <section class="exercise-card">
      <div class="exercise-text">
        <p class="mini">Exercício atual</p>
        <h2 id="frase">Pá, pá, pá</h2>
        <p id="instrucao">Repita a sequência com calma, mantendo a voz leve e contínua.</p>

        <div class="actions">
          <button id="btn-ouvir" class="btn primary">Ouvir exemplo</button>
          <button id="btn-gravar" class="btn secondary">🎤 Repetir</button>
        </div>

        <div class="feedback-box">
          <p>Você falou:</p>
          <span id="resultado">...</span>
        </div>

        <p id="feedback" class="feedback"></p>

        <div class="nav-actions">
          <button id="btn-proximo" class="btn ghost" disabled>Próximo →</button>
          <button id="btn-reiniciar" class="btn ghost">Reiniciar</button>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/lingua-maluca.js"></script>
</body>
</html>
