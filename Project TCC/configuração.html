<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FonemaViva - Configurações</title>

  <link
    rel="stylesheet"
    href="./css/configuração.css"
  >

</head>

<body>

  <!-- =====================================================
       LAYOUT PRINCIPAL
       ===================================================== -->

  <div class="layout-configuracoes">


    <!-- ===================================================
         MENU LATERAL
         =================================================== -->

    <aside
      class="menu-lateral"
      aria-label="Menu principal"
    >

      <!-- Logo / Nome -->

      <div class="menu-cabecalho">

        <a
          href="./home.html"
          class="logo-fonemaviva"
        >
          FONEMAVIVA
        </a>

      </div>


      <!-- Navegação -->

      <nav class="navegacao-principal">

        <a
          href="./home.html"
          class="item-menu"
        >

          <span
            class="icone-menu"
            aria-hidden="true"
          >
            <i class="fa-solid fa-house"></i>
          </span>

          <span>
            Início
          </span>

        </a>


        <a
          href="./perfil.html"
          class="item-menu"
        >

          <span
            class="icone-menu"
            aria-hidden="true"
          >
            <i class="fa-solid fa-user"></i>
          </span>

          <span>
            Perfil
          </span>

        </a>


        <a
         
          class="item-menu ativo"
          aria-current="page"
        >

          <span
            class="icone-menu"
            aria-hidden="true"
          >
            <i class="fa-solid fa-gear"></i>
          </span>

          <span>
            Configurações
          </span>

        </a>


        <a
          href="./acessibilidade.html"
          class="item-menu"
        >

          <span
            class="icone-menu"
            aria-hidden="true"
          >
            <i class="fa-solid fa-universal-access"></i>
          </span>

          <span>
            Acessibilidade
          </span>

        </a>


        <a
          href="./privacidade.html"
          class="item-menu"
        >

          <span
            class="icone-menu"
            aria-hidden="true"
          >
            <i class="fa-solid fa-shield-halved"></i>
          </span>

          <span>
            Privacidade
          </span>

        </a>

      </nav>

    </aside>


    <!-- ===================================================
         CONTEÚDO PRINCIPAL
         =================================================== -->

    <main class="conteudo-configuracoes">


      <!-- =================================================
           CABEÇALHO
           ================================================= -->

      <header class="cabecalho-configuracoes">

        <div class="titulo-configuracoes">

          <h1>
            Configurações
          </h1>

          <p>
            Gerencie suas preferências do FonemaViva
          </p>

        </div>

      </header>


      <!-- =================================================
           PREFERÊNCIAS
           ================================================= -->

      <section class="grupo-configuracoes">

        <div class="cabecalho-grupo">

          <h2>
            Preferências
          </h2>

        </div>


        <div class="lista-configuracoes">


          <!-- Notificações -->

          <button
            type="button"
            class="item-configuracao"
            id="btnNotificacoes"
          >

            <span
              class="icone-configuracao"
              aria-hidden="true"
            >
              <i class="fa-regular fa-bell"></i>
            </span>

            <span class="conteudo-configuracao">

              <strong>
                Notificações
              </strong>

              <span>
                Gerencie seus avisos e lembretes
              </span>

            </span>

            <span
              class="seta-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </span>

          </button>


          <!-- Exercícios -->

          <button
            type="button"
            class="item-configuracao"
            id="btnExercicios"
          >

            <span
              class="icone-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-brain"></i>
            </span>

            <span class="conteudo-configuracao">

              <strong>
                Exercícios
              </strong>

              <span>
                Personalize o funcionamento dos exercícios
              </span>

            </span>

            <span
              class="seta-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </span>

          </button>


          <!-- Continuar exercícios -->

          <button
            type="button"
            class="item-configuracao"
            id="btnContinuarExercicios"
          >

            <span
              class="icone-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </span>

            <span class="conteudo-configuracao">

              <strong>
                Continuar exercícios
              </strong>

              <span>
                Retome automaticamente os exercícios de onde parou
              </span>

            </span>

            <span
              class="seta-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </span>

          </button>


        </div>

      </section>


      <!-- =================================================
           CONTA E DISPOSITIVOS
           ================================================= -->

      <section class="grupo-configuracoes">

        <div class="cabecalho-grupo">

          <h2>
            Conta e dispositivos
          </h2>

        </div>


        <div class="lista-configuracoes">


          <!-- Dispositivos conectados -->

          <button
            type="button"
            class="item-configuracao"
            id="btnDispositivos"
          >

            <span
              class="icone-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-desktop"></i>
            </span>

            <span class="conteudo-configuracao">

              <strong>
                Dispositivos conectados
              </strong>

              <span>
                Veja onde sua conta está conectada
              </span>

            </span>

            <span
              class="seta-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </span>

          </button>


          <!-- Excluir conta -->

          <button
            type="button"
            class="item-configuracao item-perigoso"
            id="btnExcluirConta"
          >

            <span
              class="icone-configuracao"
              aria-hidden="true"
            >
              <i class="fa-regular fa-trash-can"></i>
            </span>

            <span class="conteudo-configuracao">

              <strong>
                Excluir conta
              </strong>

              <span>
                Exclua permanentemente sua conta e os dados associados
              </span>

            </span>

            <span
              class="seta-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </span>

          </button>


        </div>

      </section>


      <!-- =================================================
           SOBRE
           ================================================= -->

      <section class="grupo-configuracoes">

        <div class="cabecalho-grupo">

          <h2>
            Sobre
          </h2>

        </div>


        <div class="lista-configuracoes">


          <!-- Sobre o FonemaViva -->

          <button
            type="button"
            class="item-configuracao"
            id="btnSobre"
          >

            <span
              class="icone-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-circle-info"></i>
            </span>

            <span class="conteudo-configuracao">

              <strong>
                Sobre o FonemaViva
              </strong>

              <span>
                Informações, versão e detalhes do aplicativo
              </span>

            </span>

            <span
              class="seta-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </span>

          </button>


          <!-- Termos de uso -->

          <button
            type="button"
            class="item-configuracao"
            id="btnTermos"
          >

            <span
              class="icone-configuracao"
              aria-hidden="true"
            >
              <i class="fa-regular fa-file-lines"></i>
            </span>

            <span class="conteudo-configuracao">

              <strong>
                Termos de uso
              </strong>

              <span>
                Consulte os termos de utilização do FonemaViva
              </span>

            </span>

            <span
              class="seta-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </span>

          </button>


          <!-- Política de privacidade -->

          <button
            type="button"
            class="item-configuracao"
            id="btnPrivacidade"
          >

            <span
              class="icone-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-lock"></i>
            </span>

            <span class="conteudo-configuracao">

              <strong>
                Política de privacidade
              </strong>

              <span>
                Saiba como seus dados são tratados no FonemaViva
              </span>

            </span>

            <span
              class="seta-configuracao"
              aria-hidden="true"
            >
              <i class="fa-solid fa-chevron-right"></i>
            </span>

          </button>


        </div>

      </section>


      <!-- =================================================
           RODAPÉ
           ================================================= -->

      <footer class="rodape-configuracoes">

        <span>
          FonemaViva
        </span>

        <span>
          Versão 1.0.0
        </span>

      </footer>


    </main>

  </div>


  <!-- =====================================================
       FONT AWESOME
       ===================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="./js/configuração.js"></script>

</body>

</html>
