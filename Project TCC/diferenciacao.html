<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FonemaViva • Qual é esse som?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/diferenciacao.css">
</head>

<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Exercício fonológico</p>
      <h1>Qual é esse som?</h1>
      <p class="subtitle">Ouça os sons de animais e diga qual animal fez o som.</p>
    </div>
    <a class="voltar" href="./criancas.html">← Voltar</a>
  </header>

  <main class="container">
    <section class="progress-card">
      <div class="progress-top">
        <span>Seu progresso</span>
        <span id="progresso-texto">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progresso"></div>
      </div>
    </section>

    <section class="exercise-card">
      <div class="sound-panel">
        <div class="speaker">🔊</div>
        <h2 id="animal-atual">Cachorro</h2>
        <p id="instrucao">Ouça com atenção e depois fale o nome do animal.</p>

        <div class="actions">
          <button id="btn-ouvir" class="btn primary">Ouvir som</button>
          <button id="btn-falar" class="btn secondary">🎤 Responder</button>
        </div>

        <div class="feedback-box">
          <p>Você falou:</p>
          <span id="resultado">...</span>
        </div>

        <p id="feedback" class="feedback"></p>

        <div class="nav-actions">
          <button id="btn-proximo" class="btn ghost" disabled>Próximo →</button>
          <button id="btn-reiniciar" class="btn ghost">Reiniciar</button>
        </div>
      </div>
    </section>
  </main>

  <script src="./js/diferenciacao.js"></script>
</body>
</html>
